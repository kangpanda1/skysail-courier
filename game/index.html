<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skysail Courier — Fjord Bush Post</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { z-index: 1; }
  #hud   { z-index: 2; touch-action: none; }
  /* Read aloud, never shown: the line a screen reader announces when the flight state changes. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; z-index: 3; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Skysail Courier: fly a bush plane over a fjord coast, lift a crate at one airstrip and set it down on another before the tank runs dry"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript>Skysail Courier needs JavaScript and WebGL.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
